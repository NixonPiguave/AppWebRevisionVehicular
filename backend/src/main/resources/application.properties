# encoding=utf-8

# Backup - PostgreSQL tools
backup.pgdump.path=C:\\Program Files\\PostgreSQL\\18\\bin\\pg_dump.exe
backup.pgbasebackup.path=C:\\Program Files\\PostgreSQL\\18\\bin\\pg_basebackup.exe
backup.db.host=localhost
backup.db.port=5432
backup.db.name=rtv
backup.db.username=postgres
backup.db.password=1234
# Mismo archivo en cada respaldo INCREMENTAL (se sobrescribe). Si cambia esto, reinicie el backend.
backup.incremental.rolling-filename=backup_incremental_actual.backup

# Quartz almacena los jobs en memoria
spring.quartz.job-store-type=memory
spring.quartz.auto-startup=true
spring.quartz.overwrite-existing-jobs=true

