spring.application.name=backend

app.cors.allowed-origins=http://localhost:4200,http://127.0.0.1:4200
#codigo de local
server.port=8080
spring.jpa.database=postgresql
spring.jpa.show-sql=true
#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=jdbc:postgresql://localhost:5432/rtv
spring.datasource.username=postgres
spring.datasource.password=1234
spring.datasource.hikari.maximum-pool-size=5

# Crear roles de login de PostgreSQL desde la UI (/api/admin/postgres-roles).
# El usuario JDBC (spring.datasource.*) necesita CREATEROLE y poder ejecutar GRANT sobre tablas/esquemas.
admin.postgres-roles.enabled=true
