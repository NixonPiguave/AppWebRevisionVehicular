<div class="login-container">

  <!-- Panel izquierdo: Formulario minimalista -->
  <div class="login-form-panel">
    <div class="form-wrapper">

      <!-- Header minimalista -->
      <div class="form-header-minimal">
        <h1>Bienvenido</h1>
        <p>Ingresa tus credenciales</p>
      </div>

      <!-- Mensaje sesión cerrada -->
      @if (mensajeSesionCerrada) {
        <div class="mensaje-sesion-cerrada">
          <mat-icon>info</mat-icon>
          <span>{{ mensajeSesionCerrada }}</span>
        </div>
      }

      <form (ngSubmit)="login()" class="form-minimal" autocomplete="off">

        <!-- Campo Usuario -->
        <div class="input-group-minimal">
          <label for="usuario">Usuario</label>
          <input
            id="usuario"
            type="text"
            placeholder="Ingrese su usuario"
            [(ngModel)]="usuario"
            name="usuario"
            required
            autocomplete="off"
          />
        </div>

        <!-- Campo Contraseña -->
        <div class="input-group-minimal">
          <label for="password">Contraseña</label>
          <div class="input-with-icon">
            <input
              id="password"
              [type]="hidePassword ? 'password' : 'text'"
              placeholder="Ingrese su contraseña"
              [(ngModel)]="password"
              name="password"
              required
              autocomplete="off"
            />
            <button
              type="button"
              class="toggle-visibility"
              (click)="togglePassword()"
              tabindex="-1"
            >
              <mat-icon>{{ hidePassword ? 'visibility_off' : 'visibility' }}</mat-icon>
            </button>
          </div>
        </div>

        <!-- Error message -->
        @if (error) {
          <div class="error-minimal">
            <mat-icon>error_outline</mat-icon>
            <span>{{ error }}</span>
          </div>
        }

        <!-- Submit button -->
        <button class="btn-login-minimal" type="submit">
          Iniciar sesión
        </button>

      </form>

      <!-- Footer minimalista -->
      <div class="form-footer-minimal">
        <mat-icon>lock</mat-icon>
        <span>Conexión segura</span>
      </div>

    </div>
  </div>

  <!-- Panel derecho: Logo dinámico de empresa -->
  <div class="login-brand-panel">
    <div class="brand-content-centered">

      <!--  Spinner mientras carga el logo -->
      <div class="logo-loading" *ngIf="cargandoLogo">
        <div class="spinner-logo"></div>
      </div>

      <!--  Logo de empresa desde Cloudinary (si existe) -->
      <img
        *ngIf="!cargandoLogo && empresaLogo"
        [src]="empresaLogo"
        [alt]="empresaNombre"
        class="logo-main"
      />

      <!--  Logo por defecto (si no hay logo en BD) -->
      <img
        *ngIf="!cargandoLogo && !empresaLogo"
        src="/rtv_logo_sistema.png"
        alt="RTV - Revisión Técnica Vehicular"
        class="logo-main"
      />

      <p class="tagline-minimal">{{ empresaNombre }}</p>
    </div>
  </div>

</div>
