<!-- paginas/backup-manager/backup-manager.html -->
<div class="backup-container">

  <!-- Header -->
  <div class="backup-header">
    <div class="backup-titulo">
      <mat-icon>backup</mat-icon>
      <h2>Gestión de Respaldos</h2>
    </div>
    <button class="btn-notificaciones" (click)="abrirNotificaciones()"
            matTooltip="Notificaciones de respaldos">
      <mat-icon>notifications</mat-icon>
      <span class="badge" *ngIf="notificacionesNoLeidas > 0">
        {{ notificacionesNoLeidas }}
      </span>
    </button>
  </div>

  <!-- Tabs -->
  <div class="backup-tabs">
    <button class="tab-btn" [class.activa]="tabActiva === 'ejecutar'"
            (click)="cambiarTab('ejecutar')">
      <mat-icon>play_circle</mat-icon>
      Ejecutar Respaldo
    </button>
    <button class="tab-btn" [class.activa]="tabActiva === 'historial'"
            (click)="cambiarTab('historial')">
      <mat-icon>history</mat-icon>
      Historial
    </button>
    <button class="tab-btn" [class.activa]="tabActiva === 'restaurar'"
            (click)="cambiarTab('restaurar')">
      <mat-icon>restore</mat-icon>
      Restaurar Respaldo
    </button>
    <button class="tab-btn" [class.activa]="tabActiva === 'config'"
            (click)="cambiarTab('config')">
      <mat-icon>settings</mat-icon>
      Configuración
    </button>
  </div>

  <!-- Contenido de tabs -->
  <div class="backup-content">
    <app-backup-jobs-tab *ngIf="tabActiva === 'ejecutar'"></app-backup-jobs-tab>
    <app-backup-history-tab *ngIf="tabActiva === 'historial'"></app-backup-history-tab>
    <app-backup-restore-tab *ngIf="tabActiva === 'restaurar'"></app-backup-restore-tab>
    <app-backup-config-tab *ngIf="tabActiva === 'config'"></app-backup-config-tab>
  </div>
</div>

<!-- Panel notificaciones -->
<div class="modal-overlay" *ngIf="mostrarPanelNotificaciones"
     (click)="cerrarNotificaciones()">
  <div class="notif-panel" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h3>Notificaciones de Respaldos</h3>
      <button class="btn-cerrar" (click)="cerrarNotificaciones()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
    <div class="notif-lista">
      <div *ngIf="notificaciones.length === 0" class="notif-vacia">
        <mat-icon>notifications_none</mat-icon>
        <p>No hay notificaciones pendientes</p>
      </div>
      <div class="notif-item" *ngFor="let n of notificaciones"
           [class.notif-exito]="n.tipo === 'EXITO'"
           [class.notif-error]="n.tipo === 'ERROR'">
        <mat-icon>{{ n.tipo === 'EXITO' ? 'check_circle' : 'error' }}</mat-icon>
        <div class="notif-body">
          <p class="notif-titulo">{{ n.titulo }}</p>
          <p class="notif-mensaje">{{ n.mensaje }}</p>
          <p class="notif-fecha">{{ n.creadoEn | date:'dd/MM/yyyy HH:mm' }}</p>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancelar" (click)="cerrarNotificaciones()">Cerrar</button>
    </div>
  </div>
</div>
